name: Build & Release Enhanced APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo di build (release o debug)'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write
  issues: write

concurrency:
  group: nuvio-enhanced-build
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Identifica l'ultimo commit upstream da compilare
      - name: Fetch Upstream Info
        id: upstream_info
        run: |
          UPSTREAM_URL="https://github.com/NuvioMedia/NuvioMobile.git"
          UPSTREAM_BRANCH="cmp-rewrite"
          
          LATEST_SHA=$(git ls-remote "$UPSTREAM_URL" "refs/heads/$UPSTREAM_BRANCH" | awk '{print $1}')
          if [ -z "$LATEST_SHA" ]; then
            echo "::error::Impossibile ottenere l'ultimo SHA da $UPSTREAM_URL"
            exit 1
          fi
          
          SHORT_SHA=$(echo "$LATEST_SHA" | cut -c1-7)
          echo "target_sha=$LATEST_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "Target Upstream SHA: $LATEST_SHA ($SHORT_SHA)"

      # 2. Clona upstream e applica le patch modulari
      - name: Clone Upstream & Apply Patches
        run: |
          export GIT_LFS_SKIP_SMUDGE=1
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          echo "Clonazione di NuvioMobile (cmp-rewrite)..."
          git clone --branch cmp-rewrite https://github.com/NuvioMedia/NuvioMobile.git build_src
          cd build_src
          git checkout ${{ steps.upstream_info.outputs.target_sha }}
          
          echo "=== Applicazione delle patch modulari ==="
          PATCH_FILES=$(find ../patches -maxdepth 1 -name "[0-9]*.patch" | sort)
          if [ -z "$PATCH_FILES" ]; then
            PATCH_FILES=$(find ../patches -maxdepth 1 -name "*.patch" | sort)
          fi

          if [ -z "$PATCH_FILES" ]; then
            echo "::error::Nessuna patch trovata nella cartella patches/!"
            exit 1
          fi

          for patch in $PATCH_FILES; do
            patch_name=$(basename "$patch")
            echo "Applicazione della patch: $patch_name..."
            git apply --3way "$patch" || {
              echo "::error::Conflitto durante l'applicazione di $patch_name!"
              exit 1
            }
          done

          git add -A
          git commit -m "feat: apply enhanced patch bundle" || true
          
          # Copia librerie extra / native se presenti
          if [ -d "../assets/extra_libs" ]; then
            echo "Copia librerie extra_libs..."
            mkdir -p composeApp/libs
            cp -r ../assets/extra_libs/* composeApp/libs/ 2>/dev/null || true
          fi

          if [ -d "../assets/jniLibs" ]; then
            echo "Copia librerie native jniLibs..."
            mkdir -p composeApp/src/androidMain/jniLibs
            cp -r ../assets/jniLibs/* composeApp/src/androidMain/jniLibs/ 2>/dev/null || true
          fi

      # 3. Setup JDK 17 & Gradle
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # 4. Configurazione Keystore e local.properties
      - name: Configure Keystore and Properties
        working-directory: build_src
        run: |
          # Configurazione Keystore di firma
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Uso del Keystore fornito dai GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > nuvio-release.keystore
          else
            echo "Generazione di un Keystore di rilascio..."
            keytool -genkey -v -keystore nuvio-release.keystore \
              -alias nuvio-release -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass nuvio1234 -keypass nuvio1234 \
              -dname "CN=Nuvio, OU=Enhanced, O=NuvioMobile, L=Rome, S=IT, C=IT"
          fi
          
          # Creazione local.properties con fallback
          cat << 'EOF' > local.properties
          SUPABASE_URL=${{ secrets.SUPABASE_URL || 'https://api.nuvio.tv' }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzgxNTIxMzQ2LCJleHAiOjE5MzkyMDEzNDZ9.tmQaj682pwzehpqlgCDMnySOqiUvpgRbrE43T4VJpDI' }}
          NUVIO_SUPABASE_URL=${{ secrets.NUVIO_SUPABASE_URL || secrets.SUPABASE_URL || 'https://api.nuvio.tv' }}
          NUVIO_SUPABASE_ANON_KEY=${{ secrets.NUVIO_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzgxNTIxMzQ2LCJleHAiOjE5MzkyMDEzNDZ9.tmQaj682pwzehpqlgCDMnySOqiUvpgRbrE43T4VJpDI' }}
          NUVIO_SUPABASE_FALLBACK_URL=${{ secrets.NUVIO_SUPABASE_FALLBACK_URL || 'https://api-two.nuvioapp.space' }}
          TRAKT_CLIENT_ID=${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET=${{ secrets.TRAKT_CLIENT_SECRET }}
          TRAKT_REDIRECT_URI=${{ secrets.TRAKT_REDIRECT_URI }}
          INTRODB_API_URL=${{ secrets.INTRODB_API_URL }}
          TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
          NUVIO_RELEASE_STORE_FILE=nuvio-release.keystore
          NUVIO_RELEASE_STORE_PASSWORD=nuvio1234
          NUVIO_RELEASE_KEY_ALIAS=nuvio-release
          NUVIO_RELEASE_KEY_PASSWORD=nuvio1234
          DONATIONS_BASE_URL=https://donations.nuvioapp.space/
          DONATIONS_DONATE_URL=https://ko-fi.com/tapframe
          EOF

      # 5. Compilazione APK Android
      - name: Build Android APK
        working-directory: build_src
        run: |
          chmod +x ./gradlew
          
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          if [ "$BUILD_TYPE" == "debug" ]; then
            echo "Compilazione APK Debug..."
            ./gradlew :androidApp:assembleFullDebug --stacktrace
          else
            echo "Compilazione APK Release..."
            ./gradlew :androidApp:assembleFullRelease --stacktrace
          fi

      # 6. Preparazione del file APK
      - name: Package APK for Release
        id: package_apk
        working-directory: build_src
        run: |
          SHORT_SHA="${{ steps.upstream_info.outputs.short_sha }}"
          VERSION_NAME=$(grep -o '"version": *"[^"]*"' version.json | cut -d '"' -f 4 || echo "0.4.11")
          RELEASE_TAG="v${VERSION_NAME}-plus-${SHORT_SHA}"
          
          # Cerca l'APK generato
          APK_FILE=$(find androidApp/build/outputs/apk composeApp/build/outputs/apk -name "*.apk" -not -name "*unaligned*" 2>/dev/null | head -n 1)
          
          if [ -z "$APK_FILE" ]; then
            echo "::error::Nessun file APK trovato dopo la compilazione!"
            exit 1
          fi
          
          OUTPUT_NAME="NuvioPlus-${RELEASE_TAG}.apk"
          cp "$APK_FILE" "../$OUTPUT_NAME"
          
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "apk_path=$OUTPUT_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "APK preparato: $OUTPUT_NAME"

      # 7. Pubblicazione della GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package_apk.outputs.tag }}
          name: "Nuvio Plus ${{ steps.package_apk.outputs.tag }}"
          draft: false
          prerelease: false
          body: |
            ## 🚀 Nuvio Plus — Nuova Build
            
            Build compilata e firmata automaticamente in seguito all'ultimo commit.
            
            ### 📌 Informazioni Build:
            - **Base Upstream Commit:** [NuvioMedia/NuvioMobile@${{ steps.upstream_info.outputs.short_sha }}](https://github.com/NuvioMedia/NuvioMobile/commit/${{ steps.upstream_info.outputs.target_sha }})
            - **Branch Upstream:** `cmp-rewrite`
            - **Versione App:** `${{ steps.package_apk.outputs.version }}`
            - **Tag Release:** `${{ steps.package_apk.outputs.tag }}`
            
            ### ✨ Funzionalità Plus Incluse:
            - 📺 **Live TV:** Supporto canali e playlist M3U/M3U8 con EPG, ricerca e filtri categorie.
            - 🧭 **Barra di Navigazione:** Schede dedicate per Live TV & Download.
            - 🔄 **App Updater Integrato:** Aggiornamenti automatici gestiti da questo repository.
            - ⚡ **Package ID Indipendente:** `com.nuvio.app.plus` installabile in parallelo all'app originale.
          files: ${{ steps.package_apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # 8. Aggiorna lo SHA nel repository
      - name: Update Last Built Commit SHA
        run: |
          echo "${{ steps.upstream_info.outputs.target_sha }}" > .last_built_upstream_sha
          git add .last_built_upstream_sha
          git commit -m "chore: record built upstream commit ${{ steps.upstream_info.outputs.short_sha }} [skip ci]" || true
          git push origin HEAD
